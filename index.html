<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binaural Beats</title>
<meta name="theme-color" content="#070b12">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Binaural">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b12;
    --surface: #0d1420;
    --border: #1a2540;
    --accent: #00d4ff;
    --accent2: #7b5ea7;
    --text: #c8d8e8;
    --text-dim: #4a6070;
    --glow: rgba(0, 212, 255, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }

  /* 背景の星っぽいパーティクル */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(0,212,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, rgba(123,94,167,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 80%, rgba(0,212,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 60%, rgba(123,94,167,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 50%, rgba(0,212,255,0.15) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
  }

  .title-block {
    text-align: center;
    margin-bottom: 32px;
  }

  .title-block h1 {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 2rem;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,212,255,0.4);
  }

  .title-block p {
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-top: 4px;
  }

  /* 波形ビジュアライザー */
  .visualizer-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }

  .visualizer-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, var(--glow), transparent 70%);
    pointer-events: none;
  }

  canvas {
    width: 100%;
    height: 80px;
    display: block;
  }

  .freq-display {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  .freq-display span { color: var(--accent); }

  /* パネル */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .panel-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .ear-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .ear-tag {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    width: 48px;
    color: var(--text-dim);
  }

  .ear-tag.left { color: #00d4ff; }
  .ear-tag.right { color: #b07aff; }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type=range].left-ear::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(0,212,255,0.6);
    cursor: pointer;
  }

  input[type=range].right-ear::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #b07aff;
    box-shadow: 0 0 8px rgba(176,122,255,0.6);
    cursor: pointer;
  }

  .freq-val {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    width: 84px;
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 3px;
  }

  .freq-val.left { color: var(--accent); }
  .freq-val.right { color: #b07aff; }

  /* 周波数の数値入力欄 */
  .num-input {
    width: 100%;
    min-width: 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: inherit;
    font: inherit;
    text-align: right;
    padding: 1px 2px;
    outline: none;
    -moz-appearance: textfield;
    appearance: textfield;
  }

  .num-input::-webkit-outer-spin-button,
  .num-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .num-input:focus { border-bottom-color: currentColor; }

  .freq-unit {
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .beat-result {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .beat-result-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .beat-hz {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.6rem;
    font-weight: 600;
    color: #fff;
  }

  .beat-hz span {
    font-size: 0.9rem;
    color: var(--text-dim);
  }

  .beat-hz .num-input {
    width: 88px;
    text-align: left;
  }

  .wave-type-badge {
    font-size: 0.7rem;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 0.1em;
    font-weight: 600;
  }

  /* ボリューム */
  .vol-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .vol-row input[type=range] {
    flex: 1;
  }

  .vol-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffffff88;
    cursor: pointer;
  }

  .vol-icon {
    font-size: 1rem;
    color: var(--text-dim);
  }

  /* 再生ボタン */
  .play-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 1.1rem;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .play-btn.off {
    background: linear-gradient(135deg, #0d3d50, #1a2540);
    color: var(--accent);
    border: 1px solid var(--accent);
    box-shadow: 0 0 20px rgba(0,212,255,0.1);
  }

  .play-btn.on {
    background: linear-gradient(135deg, #003d50, #001a30);
    color: #fff;
    border: 1px solid var(--accent);
    box-shadow: 0 0 30px rgba(0,212,255,0.3), inset 0 0 20px rgba(0,212,255,0.05);
    animation: pulse-border 2s ease-in-out infinite;
  }

  @keyframes pulse-border {
    0%, 100% { box-shadow: 0 0 20px rgba(0,212,255,0.2); }
    50% { box-shadow: 0 0 40px rgba(0,212,255,0.5); }
  }

  .play-btn:active { transform: scale(0.98); }

  /* 暗転ボタン */
  .dim-btn {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    font-family: 'Rajdhani', 'Noto Sans JP', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.2s;
  }

  .dim-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* 暗転オーバーレイ（タップで解除） */
  .dim-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    cursor: none;
    -webkit-tap-highlight-color: transparent;
    /* 長押し中のスクロール・拡大・選択・コンテキストメニューを抑止 */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .dim-overlay.show { display: flex; }

  /* 長押しの進み具合リング（押している間だけ表示） */
  .dim-ring {
    width: 56px;
    height: 56px;
    transform: rotate(-90deg);
    opacity: 0;
    transition: opacity 0.15s;
  }

  .dim-overlay.holding .dim-ring { opacity: 1; }

  .dim-ring circle {
    fill: none;
    stroke-width: 2;
  }

  .dim-ring .track { stroke: #151515; }
  .dim-ring .progress { stroke: #1d5866; }

  .dim-hint {
    font-size: 0.75rem;
    color: #2a2a2a;
    letter-spacing: 0.15em;
  }

  /* 表示直後だけ少し明るく、その後は控えめな色で残す */
  .dim-overlay.show .dim-hint { animation: dim-hint-fade 3s ease-out; }
  .dim-overlay.holding .dim-hint { color: #444; animation: none; }

  @keyframes dim-hint-fade {
    0%, 40% { color: #555; }
    100% { color: #2a2a2a; }
  }

  /* タイマー */
  .timer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'Rajdhani', sans-serif;
  }

  .timer-label { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.1em; }

  .timer-val {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text);
  }

  .timer-val.running { color: var(--accent); }

  /* 注意書き */
  .note {
    text-align: center;
    font-size: 0.68rem;
    color: var(--text-dim);
    margin-top: 16px;
    line-height: 1.8;
  }

  /* プリセット */
  .presets {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .preset-btn {
    min-width: 0;
    padding: 8px 2px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 0.7rem;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 0;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    line-height: 1.4;
  }

  .preset-btn:hover, .preset-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,255,0.05);
  }

  .preset-btn strong {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .low-freq-note {
    font-size: 0.65rem;
    color: var(--text-dim);
    line-height: 1.6;
    margin: -4px 0 10px;
  }
</style>
</head>
<body>
<div class="container">

  <div class="title-block">
    <h1>BINAURAL BEATS</h1>
    <p>BRAINWAVE ENTRAINMENT GENERATOR</p>
  </div>

  <!-- ビジュアライザー -->
  <div class="visualizer-wrap">
    <canvas id="canvas" height="80"></canvas>
    <div class="freq-display">
      <div>L: <span id="disp-left">250</span> Hz</div>
      <div>BEAT: <span id="disp-beat">4</span> Hz</div>
      <div>R: <span id="disp-right">254</span> Hz</div>
    </div>
  </div>

  <!-- プリセット -->
  <div class="panel">
    <div class="panel-label">PRESETS</div>
    <div class="presets" id="presets"></div>
  </div>

  <!-- 周波数コントロール -->
  <div class="panel">
    <div class="panel-label">FREQUENCY CONTROL</div>

    <div class="ear-row">
      <span class="ear-tag left">L EAR</span>
      <input type="range" class="left-ear" id="left-freq" min="40" max="500" value="250" oninput="setFreqsManual(+this.value, rightHz)">
      <span class="freq-val left">
        <input type="number" class="num-input" id="left-val" data-kind="left" inputmode="decimal" min="40" max="500" step="any" value="250" aria-label="L EAR 周波数 (Hz)">
        <span class="freq-unit">Hz</span>
      </span>
    </div>

    <div class="ear-row">
      <span class="ear-tag right">R EAR</span>
      <input type="range" class="right-ear" id="right-freq" min="40" max="500" value="254" oninput="setFreqsManual(leftHz, +this.value)">
      <span class="freq-val right">
        <input type="number" class="num-input" id="right-val" data-kind="right" inputmode="decimal" min="40" max="500" step="any" value="254" aria-label="R EAR 周波数 (Hz)">
        <span class="freq-unit">Hz</span>
      </span>
    </div>

    <p class="low-freq-note">※ 低音域（約100Hz以下）は、イヤホンや機器によって聞こえにくい場合があります</p>

    <div class="beat-result">
      <div>
        <div class="beat-result-label">BEAT FREQUENCY</div>
        <div class="beat-hz">
          <input type="number" class="num-input" id="beat-val" data-kind="beat" inputmode="decimal" min="0" step="any" value="4" aria-label="ビート周波数 (Hz)">
          <span>Hz</span>
        </div>
      </div>
      <div class="wave-type-badge" id="wave-badge" style="background:rgba(0,212,255,0.1);color:#00d4ff;border:1px solid #00d4ff;">
        THETA
      </div>
    </div>
  </div>

  <!-- ボリューム -->
  <div class="panel">
    <div class="panel-label">VOLUME</div>
    <div class="vol-row">
      <span class="vol-icon">🔈</span>
      <input type="range" id="volume" min="0" max="100" value="40" oninput="updateVolume()">
      <span class="vol-icon">🔊</span>
    </div>
  </div>

  <!-- 再生ボタン -->
  <button class="play-btn off" id="play-btn" onclick="togglePlay()">
    ▶ START
  </button>

  <button class="dim-btn" id="dim-btn" onclick="enterDim()">◐ 暗転</button>

  <!-- タイマー -->
  <div class="timer-row">
    <span class="timer-label">ELAPSED TIME</span>
    <span class="timer-val" id="timer">00:00</span>
  </div>

  <p class="note">
    🎧 必ずステレオヘッドフォンを使用してください<br>
    バイノーラルビートはヘッドフォンなしでは機能しません
  </p>

</div>

<div class="dim-overlay" id="dim-overlay" role="button" aria-label="長押しで暗転を解除">
  <svg class="dim-ring" viewBox="0 0 56 56" aria-hidden="true">
    <circle class="track" cx="28" cy="28" r="26"></circle>
    <circle class="progress" id="dim-ring-progress" cx="28" cy="28" r="26"></circle>
  </svg>
  <span class="dim-hint">長押しで解除</span>
</div>

<script>
let audioCtx = null;
let leftOsc = null, rightOsc = null;
let gainNode = null;
let isPlaying = false;
let timerInterval = null;
let elapsed = 0;
let animFrame = null;
let wakeLock = null;
let isDimmed = false;

const canvas = document.getElementById('canvas');
const ctx2d = canvas.getContext('2d');

// 周波数の正はスライダーではなくこの2変数（スライダーは整数stepなので小数を保持できない）
const FREQ_MIN = 40, FREQ_MAX = 500;
let leftHz = 250, rightHz = 254;

const round2 = (x) => Math.round(x * 100) / 100;
const clamp = (x, min, max) => Math.min(max, Math.max(min, x));

function getLeftFreq() { return leftHz; }
function getRightFreq() { return rightHz; }

// 値が変わったら true を返す
function setFreqs(l, r) {
  const nl = round2(clamp(l, FREQ_MIN, FREQ_MAX));
  const nr = round2(clamp(r, FREQ_MIN, FREQ_MAX));
  const changed = nl !== leftHz || nr !== rightHz;
  leftHz = nl;
  rightHz = nr;
  updateFreqs();
  return changed;
}

// 手動操作（スライダー・数値入力）。値が変わったらプリセットの選択を外す
function setFreqsManual(l, r) {
  if (setFreqs(l, r)) setActivePreset(null);
}

// ビート周波数の帯域判定（半開区間）。バッジとプリセット表記の両方がこれを使う。0Hz は帯域なし（null）
const BANDS = [
  { max: 4,        greek: 'δ', label: 'DELTA', color: '#6080ff' },
  { max: 8,        greek: 'θ', label: 'THETA', color: '#00d4ff' },
  { max: 13,       greek: 'α', label: 'ALPHA', color: '#00ff9d' },
  { max: 30,       greek: 'β', label: 'BETA',  color: '#ffcc00' },
  { max: Infinity, greek: 'γ', label: 'GAMMA', color: '#ff6060' },
];
function getBand(beat) {
  if (!(beat > 0)) return null;
  return BANDS.find((b) => beat < b.max);
}

// 入力欄の確定（blur / Enter）。範囲外はクランプ、不正値は直前値に戻す
function commitInput(el) {
  const v = parseFloat(el.value);
  if (el.value.trim() === '' || !Number.isFinite(v)) { updateFreqs(); return; }
  if (el.dataset.kind === 'left') setFreqsManual(v, rightHz);
  else if (el.dataset.kind === 'right') setFreqsManual(leftHz, v);
  else setBeat(v);
}

// L を固定し、R 側の向き（L より上か下か）を保ったままビート幅を変える。L・R とも範囲内にクランプ
function setBeat(v) {
  const up = rightHz >= leftHz;
  const beat = clamp(v, 0, up ? FREQ_MAX - leftHz : leftHz - FREQ_MIN);
  setFreqsManual(leftHz, up ? leftHz + beat : leftHz - beat);
}

document.querySelectorAll('.num-input').forEach((el) => {
  el.addEventListener('blur', () => commitInput(el));
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { commitInput(el); el.blur(); }
    else if (e.key === 'Escape') { updateFreqs(); el.blur(); }
  });
});

function updateFreqs() {
  const l = leftHz;
  const r = rightHz;
  const beat = round2(Math.abs(r - l));

  document.getElementById('left-freq').value = l;
  document.getElementById('right-freq').value = r;
  document.getElementById('left-val').value = l;
  document.getElementById('right-val').value = r;
  document.getElementById('beat-val').value = beat;
  document.getElementById('beat-val').max = round2(r >= l ? FREQ_MAX - l : l - FREQ_MIN);
  document.getElementById('disp-left').textContent = l;
  document.getElementById('disp-right').textContent = r;
  document.getElementById('disp-beat').textContent = beat;

  // 波形タイプ判定
  const badge = document.getElementById('wave-badge');
  const band = getBand(beat);
  const label = band ? band.label : '—';
  const color = band ? band.color : '#4a6070';
  badge.textContent = label;
  badge.style.color = color;
  badge.style.borderColor = color;
  badge.style.background = color + '18';

  // 再生中なら周波数を即時更新
  if (isPlaying && leftOsc && rightOsc) {
    leftOsc.frequency.setTargetAtTime(l, audioCtx.currentTime, 0.05);
    rightOsc.frequency.setTargetAtTime(r, audioCtx.currentTime, 0.05);
  }
}

function updateVolume() {
  const vol = document.getElementById('volume').value / 100;
  if (gainNode) gainNode.gain.setTargetAtTime(vol * 0.4, audioCtx.currentTime, 0.05);
}

// プリセット。帯域のギリシャ文字は getBand() から生成する
const PRESETS = [
  { l: 200, r: 202, desc: '深い睡眠' },
  { l: 250, r: 254, desc: '瞑想・直感' },
  { l: 250, r: 256, desc: '深リラックス' },
  { l: 200, r: 210, desc: '集中・フロー' },
  { l: 250, r: 268, desc: '集中・思考' },
  { l: 300, r: 340, desc: '高度な集中・認知' },
];

function renderPresets() {
  const wrap = document.getElementById('presets');
  PRESETS.forEach((p) => {
    const beat = round2(Math.abs(p.r - p.l));
    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    const strong = document.createElement('strong');
    strong.textContent = getBand(beat).greek + ' ' + beat + 'Hz';
    btn.append(strong, p.desc);
    btn.addEventListener('click', () => applyPreset(p.l, p.r, btn));
    if (p.l === leftHz && p.r === rightHz) btn.classList.add('active');
    wrap.appendChild(btn);
  });
}

function setActivePreset(btn) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('active', b === btn));
}

function applyPreset(l, r, btn) {
  setFreqs(l, r);
  setActivePreset(btn);
}

function togglePlay() {
  if (isPlaying) {
    stopAudio();
  } else {
    startAudio();
  }
}

// START/STOP 時のフェード時間（秒）。急な振幅変化によるクリック音を防ぐ
const FADE = 0.05;

function startAudio() {
  // 'playback' は低遅延より安定性優先の大きめバッファ。画面オフ・Bluetooth 時の音飛び対策
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });

  const merger = audioCtx.createChannelMerger(2);
  gainNode = audioCtx.createGain();
  const vol = document.getElementById('volume').value / 100;
  const t0 = audioCtx.currentTime;
  gainNode.gain.setValueAtTime(0, t0);
  gainNode.gain.linearRampToValueAtTime(vol * 0.4, t0 + FADE);

  // 左耳オシレーター
  leftOsc = audioCtx.createOscillator();
  const leftGain = audioCtx.createGain();
  leftGain.gain.value = 1;
  leftOsc.frequency.value = getLeftFreq();
  leftOsc.type = 'sine';
  leftOsc.connect(leftGain);
  leftGain.connect(merger, 0, 0);

  // 右耳オシレーター
  rightOsc = audioCtx.createOscillator();
  const rightGain = audioCtx.createGain();
  rightGain.gain.value = 1;
  rightOsc.frequency.value = getRightFreq();
  rightOsc.type = 'sine';
  rightOsc.connect(rightGain);
  rightGain.connect(merger, 0, 1);

  merger.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  leftOsc.start();
  rightOsc.start();

  isPlaying = true;
  const btn = document.getElementById('play-btn');
  btn.textContent = '⏹ STOP';
  btn.className = 'play-btn on';

  // タイマー
  elapsed = 0;
  timerInterval = setInterval(() => {
    elapsed++;
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    const timerEl = document.getElementById('timer');
    timerEl.textContent = m + ':' + s;
    timerEl.className = 'timer-val running';
  }, 1000);

  requestWakeLock();
  if (!isDimmed) drawWave();
}

function stopAudio() {
  // フェードアウト後に停止する。参照は先に切り離すので、フェード中の再 START は新しい context で始まる
  const ctx = audioCtx, l = leftOsc, r = rightOsc, g = gainNode;
  audioCtx = null; leftOsc = null; rightOsc = null; gainNode = null;
  isPlaying = false;

  if (ctx) {
    const t = ctx.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0, t + FADE);
    l.stop(t + FADE);
    r.stop(t + FADE);
    setTimeout(() => ctx.close(), FADE * 1000 + 50);
  }

  const btn = document.getElementById('play-btn');
  btn.textContent = '▶ START';
  btn.className = 'play-btn off';

  clearInterval(timerInterval);
  document.getElementById('timer').className = 'timer-val';

  releaseWakeLock();

  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  clearCanvas();
}

// 再生中は画面の自動消灯を防ぐ（Screen Wake Lock API。非対応ブラウザでは何もしない）
async function requestWakeLock() {
  if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
  try {
    const sentinel = await navigator.wakeLock.request('screen');
    // 取得待ちの間に STOP された場合は即解除
    if (!isPlaying) { sentinel.release(); return; }
    wakeLock = sentinel;
    sentinel.addEventListener('release', () => { if (wakeLock === sentinel) wakeLock = null; });
  } catch (e) {
    // 省電力モード等で拒否されることがある。再生自体は続ける
  }
}

function releaseWakeLock() {
  if (!wakeLock) return;
  const sentinel = wakeLock;
  wakeLock = null;
  sentinel.release().catch(() => {});
}

// タブが隠れると wake lock は自動解除されるので、復帰時に取り直す
document.addEventListener('visibilitychange', () => {
  if (isPlaying && document.visibilityState === 'visible') requestWakeLock();
});

// 暗転: 全画面を黒で覆い、ビジュアライザーの描画を止める
function enterDim() {
  isDimmed = true;
  document.getElementById('dim-overlay').classList.add('show');
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
}

function exitDim() {
  cancelHold();
  isDimmed = false;
  document.getElementById('dim-overlay').classList.remove('show');
  if (isPlaying && !animFrame) drawWave();
}

// 暗転の解除は長押し（誤タップで解除されないように）。音声には触れない
const HOLD_MS = 2000;      // 解除までの長押し時間
const HOLD_MOVE_PX = 24;   // これ以上指が動いたら長押しを中止
const dimOverlay = document.getElementById('dim-overlay');
const ringProgress = document.getElementById('dim-ring-progress');
const RING_LEN = 2 * Math.PI * 26;
ringProgress.style.strokeDasharray = RING_LEN;
ringProgress.style.strokeDashoffset = RING_LEN;
let hold = null; // { id, x, y, start, frame }

function setHoldProgress(p) {
  ringProgress.style.strokeDashoffset = RING_LEN * (1 - p);
}

function cancelHold() {
  if (!hold) return;
  cancelAnimationFrame(hold.frame);
  hold = null;
  dimOverlay.classList.remove('holding');
  setHoldProgress(0);
}

function tickHold() {
  if (!hold) return;
  const p = Math.min(1, (performance.now() - hold.start) / HOLD_MS);
  setHoldProgress(p);
  if (p >= 1) { exitDim(); suppressNextClick(); }
  else hold.frame = requestAnimationFrame(tickHold);
}

// 解除直後に指を離したとき、下にある START/STOP 等へ click が届かないようにする
function suppressNextClick() {
  const block = (e) => { e.stopPropagation(); e.preventDefault(); };
  window.addEventListener('click', block, { capture: true, once: true });
  setTimeout(() => window.removeEventListener('click', block, { capture: true }), 600);
}

dimOverlay.addEventListener('pointerdown', (e) => {
  if (hold || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  dimOverlay.setPointerCapture(e.pointerId);
  hold = { id: e.pointerId, x: e.clientX, y: e.clientY, start: performance.now(), frame: 0 };
  dimOverlay.classList.add('holding');
  hold.frame = requestAnimationFrame(tickHold);
});

dimOverlay.addEventListener('pointermove', (e) => {
  if (!hold || e.pointerId !== hold.id) return;
  if (Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > HOLD_MOVE_PX) cancelHold();
});

['pointerup', 'pointercancel', 'lostpointercapture'].forEach((type) => {
  dimOverlay.addEventListener(type, (e) => { if (hold && e.pointerId === hold.id) cancelHold(); });
});

dimOverlay.addEventListener('contextmenu', (e) => e.preventDefault());

function clearCanvas() {
  canvas.width = canvas.offsetWidth;
  ctx2d.clearRect(0, 0, canvas.width, canvas.height);
}

let phase = 0;
function drawWave() {
  canvas.width = canvas.offsetWidth;
  const w = canvas.width;
  const h = canvas.height;

  ctx2d.clearRect(0, 0, w, h);

  const beat = Math.abs(getRightFreq() - getLeftFreq());
  const l = getLeftFreq();
  const r = getRightFreq();

  // 合成波（簡易的に視覚化）
  ctx2d.beginPath();
  ctx2d.strokeStyle = '#00d4ff';
  ctx2d.lineWidth = 1.5;
  ctx2d.shadowColor = '#00d4ff';
  ctx2d.shadowBlur = 6;

  for (let x = 0; x < w; x++) {
    const t = (x / w) * Math.PI * 2 * 4 + phase;
    const amp = (Math.sin(t * (beat / 10)) * 0.5 + 0.5);
    const y = h / 2 + Math.sin(t * (l / 50)) * amp * (h / 2 - 8);
    if (x === 0) ctx2d.moveTo(x, y);
    else ctx2d.lineTo(x, y);
  }
  ctx2d.stroke();

  // 右耳の波（薄く）
  ctx2d.beginPath();
  ctx2d.strokeStyle = 'rgba(176,122,255,0.4)';
  ctx2d.lineWidth = 1;
  ctx2d.shadowColor = '#b07aff';
  ctx2d.shadowBlur = 4;

  for (let x = 0; x < w; x++) {
    const t = (x / w) * Math.PI * 2 * 4 + phase * 1.02;
    const amp = (Math.sin(t * (beat / 10) + 0.3) * 0.5 + 0.5);
    const y = h / 2 + Math.sin(t * (r / 50)) * amp * (h / 2 - 10);
    if (x === 0) ctx2d.moveTo(x, y);
    else ctx2d.lineTo(x, y);
  }
  ctx2d.stroke();

  phase += 0.04;
  animFrame = requestAnimationFrame(drawWave);
}

// 初期化
renderPresets();
updateFreqs();

// PWA: Service Worker 登録
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
