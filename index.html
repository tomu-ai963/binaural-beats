<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binaural Beats</title>
<meta name="theme-color" content="#070b12">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Binaural">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b12;
    --surface: #0d1420;
    --border: #1a2540;
    --accent: #00d4ff;
    --accent2: #7b5ea7;
    --text: #c8d8e8;
    --text-dim: #4a6070;
    --glow: rgba(0, 212, 255, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }

  /* 背景の星っぽいパーティクル */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(0,212,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, rgba(123,94,167,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 80%, rgba(0,212,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 60%, rgba(123,94,167,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 50%, rgba(0,212,255,0.15) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
  }

  .title-block {
    text-align: center;
    margin-bottom: 32px;
  }

  .title-block h1 {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 2rem;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,212,255,0.4);
  }

  .title-block p {
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-top: 4px;
  }

  /* 波形ビジュアライザー */
  .visualizer-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }

  .visualizer-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, var(--glow), transparent 70%);
    pointer-events: none;
  }

  canvas {
    width: 100%;
    height: 80px;
    display: block;
  }

  .freq-display {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  .freq-display span { color: var(--accent); }

  /* パネル */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .panel-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .ear-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .ear-tag {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    width: 48px;
    color: var(--text-dim);
  }

  .ear-tag.left { color: #00d4ff; }
  .ear-tag.right { color: #b07aff; }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type=range].left-ear::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(0,212,255,0.6);
    cursor: pointer;
  }

  input[type=range].right-ear::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #b07aff;
    box-shadow: 0 0 8px rgba(176,122,255,0.6);
    cursor: pointer;
  }

  .freq-val {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    width: 84px;
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 3px;
  }

  .freq-val.left { color: var(--accent); }
  .freq-val.right { color: #b07aff; }

  /* 周波数の数値入力欄 */
  .num-input {
    width: 100%;
    min-width: 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: inherit;
    font: inherit;
    text-align: right;
    padding: 1px 2px;
    outline: none;
    -moz-appearance: textfield;
    appearance: textfield;
  }

  .num-input::-webkit-outer-spin-button,
  .num-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .num-input:focus { border-bottom-color: currentColor; }

  .freq-unit {
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .beat-result {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .beat-result-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .beat-hz {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.6rem;
    font-weight: 600;
    color: #fff;
  }

  .beat-hz span {
    font-size: 0.9rem;
    color: var(--text-dim);
  }

  .beat-hz .num-input {
    width: 88px;
    text-align: left;
  }

  .wave-type-badge {
    font-size: 0.7rem;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 0.1em;
    font-weight: 600;
  }

  /* ボリューム */
  .vol-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .vol-row input[type=range] {
    flex: 1;
  }

  .vol-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffffff88;
    cursor: pointer;
  }

  .vol-icon {
    font-size: 1rem;
    color: var(--text-dim);
  }

  /* 再生ボタン */
  .play-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 1.1rem;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .play-btn.off {
    background: linear-gradient(135deg, #0d3d50, #1a2540);
    color: var(--accent);
    border: 1px solid var(--accent);
    box-shadow: 0 0 20px rgba(0,212,255,0.1);
  }

  .play-btn.on {
    background: linear-gradient(135deg, #003d50, #001a30);
    color: #fff;
    border: 1px solid var(--accent);
    box-shadow: 0 0 30px rgba(0,212,255,0.3), inset 0 0 20px rgba(0,212,255,0.05);
    animation: pulse-border 2s ease-in-out infinite;
  }

  @keyframes pulse-border {
    0%, 100% { box-shadow: 0 0 20px rgba(0,212,255,0.2); }
    50% { box-shadow: 0 0 40px rgba(0,212,255,0.5); }
  }

  .play-btn:active { transform: scale(0.98); }

  /* タイマー */
  .timer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'Rajdhani', sans-serif;
  }

  .timer-label { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.1em; }

  .timer-val {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text);
  }

  .timer-val.running { color: var(--accent); }

  /* 注意書き */
  .note {
    text-align: center;
    font-size: 0.68rem;
    color: var(--text-dim);
    margin-top: 16px;
    line-height: 1.8;
  }

  /* プリセット */
  .presets {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .preset-btn {
    flex: 1;
    min-width: 80px;
    padding: 8px 6px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 0.7rem;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    line-height: 1.4;
  }

  .preset-btn:hover, .preset-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,255,0.05);
  }

  .preset-btn strong {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="container">

  <div class="title-block">
    <h1>BINAURAL BEATS</h1>
    <p>BRAINWAVE ENTRAINMENT GENERATOR</p>
  </div>

  <!-- ビジュアライザー -->
  <div class="visualizer-wrap">
    <canvas id="canvas" height="80"></canvas>
    <div class="freq-display">
      <div>L: <span id="disp-left">250</span> Hz</div>
      <div>BEAT: <span id="disp-beat">4</span> Hz</div>
      <div>R: <span id="disp-right">254</span> Hz</div>
    </div>
  </div>

  <!-- プリセット -->
  <div class="panel">
    <div class="panel-label">PRESETS</div>
    <div class="presets">
      <button class="preset-btn active" onclick="applyPreset(250,254,this)">
        <strong>θ 4Hz</strong>瞑想・直感
      </button>
      <button class="preset-btn" onclick="applyPreset(250,256,this)">
        <strong>θ 6Hz</strong>深リラックス
      </button>
      <button class="preset-btn" onclick="applyPreset(200,210,this)">
        <strong>α 10Hz</strong>集中・フロー
      </button>
      <button class="preset-btn" onclick="applyPreset(300,340,this)">
        <strong>β 40Hz</strong>覚醒・集中
      </button>
    </div>
  </div>

  <!-- 周波数コントロール -->
  <div class="panel">
    <div class="panel-label">FREQUENCY CONTROL</div>

    <div class="ear-row">
      <span class="ear-tag left">L EAR</span>
      <input type="range" class="left-ear" id="left-freq" min="80" max="500" value="250" oninput="setFreqs(+this.value, rightHz, false)" onchange="applyAudio()">
      <span class="freq-val left">
        <input type="number" class="num-input" id="left-val" data-kind="left" inputmode="decimal" min="80" max="500" step="any" value="250" aria-label="L EAR 周波数 (Hz)">
        <span class="freq-unit">Hz</span>
      </span>
    </div>

    <div class="ear-row">
      <span class="ear-tag right">R EAR</span>
      <input type="range" class="right-ear" id="right-freq" min="80" max="500" value="254" oninput="setFreqs(leftHz, +this.value, false)" onchange="applyAudio()">
      <span class="freq-val right">
        <input type="number" class="num-input" id="right-val" data-kind="right" inputmode="decimal" min="80" max="500" step="any" value="254" aria-label="R EAR 周波数 (Hz)">
        <span class="freq-unit">Hz</span>
      </span>
    </div>

    <div class="beat-result">
      <div>
        <div class="beat-result-label">BEAT FREQUENCY</div>
        <div class="beat-hz">
          <input type="number" class="num-input" id="beat-val" data-kind="beat" inputmode="decimal" min="0" step="any" value="4" aria-label="ビート周波数 (Hz)">
          <span>Hz</span>
        </div>
      </div>
      <div class="wave-type-badge" id="wave-badge" style="background:rgba(0,212,255,0.1);color:#00d4ff;border:1px solid #00d4ff;">
        THETA
      </div>
    </div>
  </div>

  <!-- ボリューム -->
  <div class="panel">
    <div class="panel-label">VOLUME</div>
    <div class="vol-row">
      <span class="vol-icon">🔈</span>
      <input type="range" id="volume" min="0" max="100" value="40" oninput="updateVolume()">
      <span class="vol-icon">🔊</span>
    </div>
  </div>

  <!-- 再生ボタン -->
  <button class="play-btn off" id="play-btn" onclick="togglePlay()">
    ▶ START
  </button>

  <!-- タイマー -->
  <div class="timer-row">
    <span class="timer-label">ELAPSED TIME</span>
    <span class="timer-val" id="timer">00:00</span>
  </div>

  <p class="note">
    🎧 必ずステレオヘッドフォンを使用してください<br>
    バイノーラルビートはヘッドフォンなしでは機能しません
  </p>

</div>

<audio id="player" loop preload="auto"></audio>

<script>
const audio = document.getElementById('player');
let isPlaying = false;
let timerInterval = null;
let elapsed = 0;
let animFrame = null;

const canvas = document.getElementById('canvas');
const ctx2d = canvas.getContext('2d');

// 周波数の正はスライダーではなくこの2変数（スライダーは整数stepなので小数を保持できない）
const FREQ_MIN = 80, FREQ_MAX = 500;
let leftHz = 250, rightHz = 254;

const round2 = (x) => Math.round(x * 100) / 100;
const clamp = (x, min, max) => Math.min(max, Math.max(min, x));

function getLeftFreq() { return leftHz; }
function getRightFreq() { return rightHz; }

// apply=false はスライダーのドラッグ中（表示だけ更新し、WAV 再生成は change で確定時に行う）
function setFreqs(l, r, apply = true) {
  leftHz = round2(clamp(l, FREQ_MIN, FREQ_MAX));
  rightHz = round2(clamp(r, FREQ_MIN, FREQ_MAX));
  updateFreqs();
  if (apply) applyAudio();
}

// 入力欄の確定（blur / Enter）。範囲外はクランプ、不正値は直前値に戻す
function commitInput(el) {
  const v = parseFloat(el.value);
  if (el.value.trim() === '' || !Number.isFinite(v)) { updateFreqs(); return; }
  if (el.dataset.kind === 'left') setFreqs(v, rightHz);
  else if (el.dataset.kind === 'right') setFreqs(leftHz, v);
  else setFreqs(leftHz, leftHz + clamp(v, 0, FREQ_MAX - leftHz));
}

document.querySelectorAll('.num-input').forEach((el) => {
  el.addEventListener('blur', () => commitInput(el));
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { commitInput(el); el.blur(); }
    else if (e.key === 'Escape') { updateFreqs(); el.blur(); }
  });
});

function updateFreqs() {
  const l = leftHz;
  const r = rightHz;
  const beat = round2(Math.abs(r - l));

  document.getElementById('left-freq').value = l;
  document.getElementById('right-freq').value = r;
  document.getElementById('left-val').value = l;
  document.getElementById('right-val').value = r;
  document.getElementById('beat-val').value = beat;
  document.getElementById('beat-val').max = round2(FREQ_MAX - l);
  document.getElementById('disp-left').textContent = l;
  document.getElementById('disp-right').textContent = r;
  document.getElementById('disp-beat').textContent = beat;

  // 波形タイプ判定
  const badge = document.getElementById('wave-badge');
  let label, color;
  if (beat < 4) { label = 'DELTA'; color = '#6080ff'; }
  else if (beat < 8) { label = 'THETA'; color = '#00d4ff'; }
  else if (beat < 14) { label = 'ALPHA'; color = '#00ff9d'; }
  else if (beat < 30) { label = 'BETA'; color = '#ffcc00'; }
  else { label = 'GAMMA'; color = '#ff6060'; }
  badge.textContent = label;
  badge.style.color = color;
  badge.style.borderColor = color;
  badge.style.background = color + '18';
}

// ---- WAV 生成 ----
// 画面オフ時も OS のメディア再生として扱われるよう、Web Audio ではなく <audio loop> で鳴らす
const SAMPLE_RATE = 22050; // 周波数上限 500Hz に対して十分
const AMP = 0.4;           // 旧実装の gain 上限（音量100%で 0.4）と同じ音圧

const gcd = (a, b) => (b ? gcd(b, a % b) : a);

// L×n と R×n がともに整数になる最小の n 秒（= 両チャンネルが整数周期で終わりループが繋がる長さ）。
// 周波数は 0.01Hz 単位なので n は 100 の約数になり、上限 100 秒に収まる
function loopSeconds(l, r) {
  const den = (f) => 100 / gcd(Math.round(f * 100), 100);
  const a = den(l), b = den(r);
  return Math.min(100, (a * b) / gcd(a, b));
}

function buildWav(l, r) {
  const frames = loopSeconds(l, r) * SAMPLE_RATE;
  const dataBytes = frames * 4; // 2ch × 16bit
  const buf = new ArrayBuffer(44 + dataBytes);
  const v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + dataBytes, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
  v.setUint32(24, SAMPLE_RATE, true); v.setUint32(28, SAMPLE_RATE * 4, true);
  v.setUint16(32, 4, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, dataBytes, true);

  // 位相は整数演算で求める（f×i/sr を浮動小数で累積すると長尺で誤差が出て周期が閉じない）
  const L100 = Math.round(l * 100), R100 = Math.round(r * 100), P = 100 * SAMPLE_RATE;
  const k = (2 * Math.PI) / P, A = AMP * 32767;
  for (let i = 0, o = 44; i < frames; i++, o += 4) {
    v.setInt16(o, Math.round(A * Math.sin(k * ((L100 * i) % P))), true);
    v.setInt16(o + 2, Math.round(A * Math.sin(k * ((R100 * i) % P))), true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

let wavKey = null, wavUrl = null;

function loadWav() {
  const key = leftHz + '/' + rightHz;
  if (key === wavKey) return;
  const old = wavUrl;
  wavUrl = URL.createObjectURL(buildWav(leftHz, rightHz));
  wavKey = key;
  audio.src = wavUrl;
  if (old) URL.revokeObjectURL(old);
  updateMediaSession();
}

// ---- 音量・フェード ----
const FADE_MS = 50;
let fadeTimer = null;

const targetVolume = () => document.getElementById('volume').value / 100;

// to は数値か関数（フェード中の音量スライダー変更を反映するため毎回評価）。
// 経過時間から進捗を出すので、バックグラウンドでタイマーが間引かれても長引かない
function fadeVolume(to, done) {
  clearInterval(fadeTimer);
  const from = audio.volume, t0 = performance.now();
  fadeTimer = setInterval(() => {
    const p = Math.min(1, (performance.now() - t0) / FADE_MS);
    const end = typeof to === 'function' ? to() : to;
    audio.volume = from + (end - from) * p;
    if (p === 1) { clearInterval(fadeTimer); fadeTimer = null; if (done) done(); }
  }, 10);
}

function updateVolume() {
  if (isPlaying && !fadeTimer) audio.volume = targetVolume();
}

// 確定した周波数を音に反映。再生中は短くフェードアウト → 差し替え → フェードイン
function applyAudio() {
  if (!isPlaying || leftHz + '/' + rightHz === wavKey) return;
  fadeVolume(0, () => {
    loadWav();
    audio.play().catch(() => {});
    fadeVolume(targetVolume);
  });
}

// ---- Media Session（ロック画面・通知からの操作）----
function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'Binaural Beats',
    artist: `L ${leftHz} Hz / R ${rightHz} Hz · BEAT ${round2(Math.abs(rightHz - leftHz))} Hz`,
    artwork: [
      { src: 'icons/icon-192.png', sizes: '192x192', type: 'image/png' },
      { src: 'icons/icon-512.png', sizes: '512x512', type: 'image/png' },
    ],
  });
}

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => { if (!isPlaying) startAudio(); });
  navigator.mediaSession.setActionHandler('pause', () => { if (isPlaying) stopAudio(); });
  navigator.mediaSession.setActionHandler('stop', () => { if (isPlaying) stopAudio(); });
}

// OS 側の都合（イヤホン抜け・他アプリ再生など）で止まったら UI を合わせる。
// 自前の停止は isPlaying=false にしてから pause するのでここには来ない
audio.addEventListener('pause', () => { if (isPlaying && !fadeTimer) stopAudio(); });

function applyPreset(l, r, btn) {
  setFreqs(l, r);
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function togglePlay() {
  if (isPlaying) {
    stopAudio();
  } else {
    startAudio();
  }
}

function startAudio() {
  loadWav();
  // STOP のフェードアウト中に再 START した場合は、今の音量からそのまま戻す
  if (audio.paused) audio.volume = 0;
  isPlaying = true;
  audio.play().catch((e) => { if (e.name !== 'AbortError' && isPlaying) stopAudio(); });
  fadeVolume(targetVolume);
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';

  const btn = document.getElementById('play-btn');
  btn.textContent = '⏹ STOP';
  btn.className = 'play-btn on';

  // タイマー
  elapsed = 0;
  timerInterval = setInterval(() => {
    elapsed++;
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    const timerEl = document.getElementById('timer');
    timerEl.textContent = m + ':' + s;
    timerEl.className = 'timer-val running';
  }, 1000);

  drawWave();
}

function stopAudio() {
  // UI は即時に戻し、音はフェードアウトしてから pause する
  isPlaying = false;
  fadeVolume(0, () => audio.pause());
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';

  const btn = document.getElementById('play-btn');
  btn.textContent = '▶ START';
  btn.className = 'play-btn off';

  clearInterval(timerInterval);
  document.getElementById('timer').className = 'timer-val';

  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  clearCanvas();
}

function clearCanvas() {
  canvas.width = canvas.offsetWidth;
  ctx2d.clearRect(0, 0, canvas.width, canvas.height);
}

let phase = 0;
function drawWave() {
  canvas.width = canvas.offsetWidth;
  const w = canvas.width;
  const h = canvas.height;

  ctx2d.clearRect(0, 0, w, h);

  const beat = Math.abs(getRightFreq() - getLeftFreq());
  const l = getLeftFreq();
  const r = getRightFreq();

  // 合成波（簡易的に視覚化）
  ctx2d.beginPath();
  ctx2d.strokeStyle = '#00d4ff';
  ctx2d.lineWidth = 1.5;
  ctx2d.shadowColor = '#00d4ff';
  ctx2d.shadowBlur = 6;

  for (let x = 0; x < w; x++) {
    const t = (x / w) * Math.PI * 2 * 4 + phase;
    const amp = (Math.sin(t * (beat / 10)) * 0.5 + 0.5);
    const y = h / 2 + Math.sin(t * (l / 50)) * amp * (h / 2 - 8);
    if (x === 0) ctx2d.moveTo(x, y);
    else ctx2d.lineTo(x, y);
  }
  ctx2d.stroke();

  // 右耳の波（薄く）
  ctx2d.beginPath();
  ctx2d.strokeStyle = 'rgba(176,122,255,0.4)';
  ctx2d.lineWidth = 1;
  ctx2d.shadowColor = '#b07aff';
  ctx2d.shadowBlur = 4;

  for (let x = 0; x < w; x++) {
    const t = (x / w) * Math.PI * 2 * 4 + phase * 1.02;
    const amp = (Math.sin(t * (beat / 10) + 0.3) * 0.5 + 0.5);
    const y = h / 2 + Math.sin(t * (r / 50)) * amp * (h / 2 - 10);
    if (x === 0) ctx2d.moveTo(x, y);
    else ctx2d.lineTo(x, y);
  }
  ctx2d.stroke();

  phase += 0.04;
  animFrame = requestAnimationFrame(drawWave);
}

// 初期化
updateFreqs();

// PWA: Service Worker 登録
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
